server:
  port: 18011

spring:
  application:
    name: emolink-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/emolink?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY}
    url: https://api.deepseek.com/chat/completions
    model: deepseek-chat
    timeout: 30000

sensitive:
  words: ${SENSITIVE_WORDS:自杀,自残,跳楼,割腕,吃药死,不想活,去死}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:18012,http://127.0.0.1:18012}
  upload:
    dir: uploads
